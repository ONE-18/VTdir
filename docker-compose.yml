services:
  virus-total-scanner:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      VT_DATABASE: /app/data/history.sqlite3
    volumes:
      - vt-history:/app/data
      - ./history.sqlite3:/app/data/history.sqlite3
    restart: unless-stopped

volumes:
  vt-history:
